  <title id="banner-title">fusion360tourdf</title>
  <desc id="banner-description">Independent community exporter for Autodesk Fusion assemblies to ROS 2 robot descriptions. A white Autodesk logo sits above the project wordmark beside an original stylized mechanical arm on a dark navy background.</desc>
